</svg></div><h2 class="font-headline-lg text-headline-lg text-on-surface mb-6 italic">

<main class="w-full md:w-[480px] h-screen bg-surface-container-lowest border-l border-outline-variant px-8 md:px-12 flex flex-col justify-center flex-shrink-0 shadow-[-10px_0_30px_rgba(15,23,42,0.05)]">
<!-- Logo -->

<!-- Login Card -->
<div class="w-full">
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your intelligent workspace.</p>
</div>
<form id="loginForm" class="space-y-6">
<!-- Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="email">EMAIL ADDRESS</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface focus:border-on-surface focus:ring-0 outline-none transition-colors" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">PASSWORD</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">FORGOT?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-4 py-3 pr-12 font-body-md text-body-md text-on-surface focus:border-on-surface focus:ring-0 outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" maxlength="128" autocomplete="current-password" type="password">
<button type="button" class="absolute inset-y-0 right-0 px-4 text-on-surface-variant hover:text-on-surface" aria-label="Show password" onclick="const input=document.getElementById('password'); const showing=input.type==='text'; input.type=showing?'password':'text'; this.querySelector('span').textContent=showing?'visibility':'visibility_off'; this.setAttribute('aria-label', showing?'Show password':'Hide password');"><span class="material-symbols-outlined">visibility</span></button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary-container text-on-primary rounded-DEFAULT py-3 font-label-sm text-label-sm flex items-center justify-center gap-2 hover:bg-on-surface transition-colors" type="submit">
                    SIGN IN
                    <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center border-t border-outline-variant pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? <a class="text-on-surface font-medium hover:underline transition-all" href="signup.html">Sign up</a>
</p>
</div>

<div id="vaultNotificationContainer" class="fixed right-5 bottom-5 z-[100] w-[min(24rem,calc(100vw-2.5rem))] space-y-3" aria-live="polite"></div>

<script>
function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;"
    })[character]);
}

function showNotification(message, type = "error") {
    const container = document.getElementById("vaultNotificationContainer");
    const notice = document.createElement("div");
    notice.className = type === "success" ? "flex items-start gap-3 border border-primary bg-surface p-4 shadow-lg" : "flex items-start gap-3 border border-error bg-error-container p-4 shadow-lg";
    notice.innerHTML = `<span class="material-symbols-outlined ${type === "success" ? "text-primary" : "text-error"}">${type === "success" ? "check_circle" : "error"}</span><p class="flex-1 text-sm text-on-surface">${escapeHtml(message)}</p><button type="button" class="text-on-surface-variant"><span class="material-symbols-outlined text-[18px]">close</span></button>`;
    const remove = () => notice.remove();
    notice.querySelector("button").onclick = remove;
    container.appendChild(notice);
    setTimeout(remove, 4500);
}
window.alert = message => showNotification(message);

function hasJwtShape(token) {
    return typeof token === "string" && /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(token);
}

// Check if a usable token is already present.
const existingToken = localStorage.getItem("token");

if (hasJwtShape(existingToken)) {
    window.location.href = "dashboard.html";
} else {
    localStorage.removeItem("token");
}

const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
const response = await fetch("http://127.0.0.1:5000/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.message || "Login failed");
                return;
            }

            localStorage.setItem("token", data.token);
            showNotification("Signed in successfully.", "success");
            setTimeout(() => window.location.href = "dashboard.html", 650);

        } catch (error) {
            console.error("Login error:", error);
            alert("Unable to connect to VaultFlow server.");
        }
    });
</script>
